<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0814">
<title>Ferchito ❤️ — 16 años de recuerdos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08060f; --bg2:#120b22; --bg3:#1b1030;
  --gold:#ffd86b; --gold-2:#f0b73c; --gold-3:#ffeaa7;
  --pink:#ff6b8a; --pink-2:#ff3d68;
  --purple:#8b5cf6; --blue:#5ac8ff;
  --white:#fffaf5; --muted:#bcb0d0;
  --line:rgba(255,216,107,.35);
  --page-radius:34px;
  --shadow-deep:0 30px 80px rgba(0,0,0,.55);
  --shadow-glow:0 0 60px rgba(255,216,107,.15);
  --gold-grad:linear-gradient(135deg,#fff4c7 0%,#ffd86b 30%,#f0b73c 60%,#fff4c7 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Montserrat',sans-serif;color:var(--white);min-height:100vh;
  background:var(--bg);
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}

/* ===== FONDO AURORA ANIMADO ===== */
.aurora{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.aurora span{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  animation:auroraFloat 18s ease-in-out infinite;
}
.aurora span:nth-child(1){
  width:520px;height:520px;top:-10%;left:-8%;
  background:radial-gradient(circle,rgba(255,216,107,.55),transparent 70%);
  animation-delay:0s;
}
.aurora span:nth-child(2){
  width:600px;height:600px;top:20%;right:-12%;
  background:radial-gradient(circle,rgba(255,107,138,.4),transparent 70%);
  animation-delay:4s;
}
.aurora span:nth-child(3){
  width:560px;height:560px;bottom:-10%;left:20%;
  background:radial-gradient(circle,rgba(139,92,246,.45),transparent 70%);
  animation-delay:8s;
}
.aurora span:nth-child(4){
  width:420px;height:420px;top:45%;left:40%;
  background:radial-gradient(circle,rgba(90,200,255,.28),transparent 70%);
  animation-delay:12s;
}
@keyframes auroraFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.1)}
  66%{transform:translate(-30px,40px) scale(.95)}
}

body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:38px 38px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
}

/* ===== CONFETI ===== */
#confettiCanvas{
  position:fixed;inset:0;pointer-events:none;z-index:5;
}

/* ===== LIBRO ===== */
.book{
  position:relative;width:100%;max-width:1180px;
  margin:0 auto;padding:24px 22px 110px;
  z-index:2;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;justify-content:center;
}

/* ===== PORTADA ===== */
.cover{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:50px 28px;width:100%;
  min-height:88vh;
  animation:fadeIn 1.2s ease;
  position:relative;
}

.particles{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.particles i{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 10px var(--gold);
  opacity:.7;animation:floatUp linear infinite;
}
.particles i:nth-child(1){left:8%;animation-duration:14s;animation-delay:0s;width:3px;height:3px}
.particles i:nth-child(2){left:18%;animation-duration:18s;animation-delay:2s}
.particles i:nth-child(3){left:28%;animation-duration:16s;animation-delay:5s;width:5px;height:5px}
.particles i:nth-child(4){left:42%;animation-duration:20s;animation-delay:1s}
.particles i:nth-child(5){left:56%;animation-duration:15s;animation-delay:7s;width:3px;height:3px}
.particles i:nth-child(6){left:68%;animation-duration:19s;animation-delay:3s}
.particles i:nth-child(7){left:78%;animation-duration:17s;animation-delay:6s;width:5px;height:5px}
.particles i:nth-child(8){left:88%;animation-duration:13s;animation-delay:4s}
.particles i:nth-child(9){left:34%;animation-duration:22s;animation-delay:9s;width:3px;height:3px}
.particles i:nth-child(10){left:62%;animation-duration:21s;animation-delay:8s}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:.8}
  90%{opacity:.8}
  100%{transform:translateY(-10vh) scale(1.2);opacity:0}
}

.balloon{
  position:absolute;font-size:46px;opacity:.85;
  animation:floatBalloon 7s ease-in-out infinite;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));
}
.balloon:nth-child(1){top:9%;left:5%;animation-delay:0s}
.balloon:nth-child(2){top:16%;right:7%;animation-delay:1.4s;font-size:56px}
.balloon:nth-child(3){bottom:20%;left:9%;animation-delay:2.6s;font-size:40px}
.balloon:nth-child(4){bottom:24%;right:5%;animation-delay:.9s;font-size:48px}
@keyframes floatBalloon{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-22px) rotate(4deg)}
}

.sparkle{
  position:absolute;color:var(--gold);font-size:22px;
  animation:twinkle 3s ease-in-out infinite;
  text-shadow:0 0 12px var(--gold);
}
.sparkle:nth-child(5){top:22%;left:20%;animation-delay:.5s}
.sparkle:nth-child(6){top:32%;right:24%;animation-delay:1.5s;font-size:28px}
.sparkle:nth-child(7){bottom:32%;left:16%;animation-delay:2.2s}
.sparkle:nth-child(8){bottom:22%;right:18%;animation-delay:.9s;font-size:26px}
@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.7) rotate(0deg)}
  50%{opacity:1;transform:scale(1.25) rotate(180deg)}
}

.kicker{
  display:inline-flex;gap:10px;align-items:center;padding:11px 26px;
  border:1px solid var(--line);
  border-radius:999px;color:var(--gold-3);
  font-size:12px;letter-spacing:4px;text-transform:uppercase;font-weight:600;
  background:rgba(255,216,107,.06);
  backdrop-filter:blur(12px);margin-bottom:26px;
  box-shadow:0 0 30px rgba(255,216,107,.12), inset 0 0 20px rgba(255,216,107,.06);
  animation:glowPulse 3.5s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 30px rgba(255,216,107,.12), inset 0 0 20px rgba(255,216,107,.06)}
  50%{box-shadow:0 0 50px rgba(255,216,107,.3), inset 0 0 25px rgba(255,216,107,.12)}
}

.orbit{
  position:relative;width:180px;height:180px;
  display:grid;place-items:center;margin:10px 0 4px;
}
.orbit::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(255,216,107,.55) 25%,transparent 50%,rgba(255,107,138,.55) 75%,transparent 100%);
  animation:orbitSpin 6s linear infinite;
  mask:radial-gradient(circle, transparent 62%, black 64%);
  -webkit-mask:radial-gradient(circle, transparent 62%, black 64%);
  filter:blur(.3px);
}
.orbit::after{
  content:"";position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,216,107,.1),transparent 70%);
}
@keyframes orbitSpin{
  to{transform:rotate(360deg)}
}
.orbit .cake{
  font-size:82px;position:relative;z-index:1;
  animation:cakeBounce 2.4s ease-in-out infinite;
  filter:drop-shadow(0 12px 30px rgba(255,216,107,.45));
}
@keyframes cakeBounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-12px) scale(1.06)}
}

.cover h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(56px,11vw,116px);
  line-height:.9;font-weight:700;letter-spacing:-1px;
  background:var(--gold-grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,216,107,.35))
         drop-shadow(0 4px 12px rgba(240,183,60,.3));
  margin-bottom:2px;
  background-size:200% 200%;
  animation:goldShine 5s ease-in-out infinite;
}
@keyframes goldShine{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.cover h1 span{
  display:inline-block;
  -webkit-text-fill-color:var(--pink);
  color:var(--pink);
  filter:drop-shadow(0 0 20px rgba(255,107,138,.6));
  animation:heartbeat 1.6s ease-in-out infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  15%{transform:scale(1.22)}
  30%{transform:scale(1)}
  45%{transform:scale(1.15)}
  60%{transform:scale(1)}
}

.cover .name-script{
  font-family:'Great Vibes',cursive;
  font-size:clamp(42px,8vw,74px);
  color:var(--pink);margin-top:-14px;
  text-shadow:0 0 30px rgba(255,107,138,.5),
              0 0 70px rgba(255,107,138,.25);
}

.cover p.sub{
  max-width:620px;margin:28px auto 0;
  color:var(--muted);font-size:16px;
  line-height:1.85;font-style:italic;font-weight:300;
  letter-spacing:.3px;
}

/* ===== INSIGNIA 16 AÑOS — TEXTO NEGRO SOBRE DORADO ===== */
.age-badge{
  position:relative;
  display:inline-flex;align-items:center;gap:16px;
  margin:34px 0 6px;padding:16px 44px;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShine 4s ease-in-out infinite;
  border:none;
  border-radius:999px;
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:700;letter-spacing:3px;
  color:#0b0814;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
  box-shadow:0 0 40px rgba(255,216,107,.5),
             0 8px 25px rgba(0,0,0,.35),
             inset 0 -2px 6px rgba(0,0,0,.15);
}

.btn-start{
  position:relative;
  margin-top:38px;padding:20px 52px;
  border-radius:999px;border:none;
  background:linear-gradient(135deg,rgba(255,216,107,.28),rgba(255,216,107,.06));
  color:var(--gold);
  font-size:15px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;font-family:'Montserrat',sans-serif;
  cursor:pointer;overflow:hidden;
  transition:all .4s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 35px rgba(255,216,107,.2),
             inset 0 0 0 1.5px rgba(255,216,107,.6);
  backdrop-filter:blur(10px);
}
.btn-start::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transition:left .7s ease;
}
.btn-start:hover{
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:#1a0f2e;
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 15px 40px rgba(255,216,107,.5),
             0 0 60px rgba(255,216,107,.4),
             inset 0 0 0 1.5px rgba(255,216,107,.9);
}
.btn-start:hover::before{left:100%}
.btn-start:active{transform:translateY(-1px) scale(1.01)}

@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== PÁGINA ===== */
.page{
  display:none;width:100%;
  animation:slideUp .7s cubic-bezier(.22,1,.36,1);
}
.page.active{display:block;}
@keyframes slideUp{
  from{opacity:0;transform:translateY(50px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.page-inner{
  background:
    radial-gradient(circle at 10% 0%,rgba(255,216,107,.06),transparent 45%),
    radial-gradient(circle at 90% 100%,rgba(255,107,138,.05),transparent 45%),
    linear-gradient(155deg,rgba(38,26,62,.96),rgba(11,8,22,.98));
  border:1px solid rgba(255,216,107,.22);
  border-radius:var(--page-radius);
  box-shadow:var(--shadow-deep),var(--shadow-glow);
  padding:0;overflow:hidden;position:relative;
}
.page-inner::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--pink),var(--purple),var(--gold),transparent);
  background-size:250% 100%;
  animation:rainbowBar 5s linear infinite;
}
@keyframes rainbowBar{
  0%{background-position:0% 50%}
  100%{background-position:250% 50%}
}

.corner-deco{
  position:absolute;font-size:22px;opacity:.45;pointer-events:none;
  color:var(--gold);
  text-shadow:0 0 12px rgba(255,216,107,.6);
}
.corner-deco.tl{top:16px;left:20px}
.corner-deco.tr{top:16px;right:20px}
.corner-deco.bl{bottom:16px;left:20px}
.corner-deco.br{bottom:16px;right:20px}

.page-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:32px 40px 8px;gap:16px;position:relative;
}
.page-header .year-wrap{
  display:flex;align-items:center;gap:18px;
}
.year-cake{
  font-size:38px;
  animation:cakeBounce 2.4s ease-in-out infinite;
  filter:drop-shadow(0 6px 14px rgba(255,216,107,.4));
}
.page-header .year{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(42px,6.5vw,66px);
  font-weight:700;letter-spacing:2px;line-height:1;
  background:var(--gold-grad);background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,216,107,.35));
  animation:goldShine 5s ease-in-out infinite;
}
.page-counter{
  font-size:11px;color:var(--gold-3);letter-spacing:2.5px;
  background:rgba(255,216,107,.08);padding:9px 20px;border-radius:999px;
  border:1px solid rgba(255,216,107,.28);white-space:nowrap;
  font-weight:600;text-transform:uppercase;
  backdrop-filter:blur(8px);
}

.page-phrase{
  padding:0 40px 26px;
  color:var(--white);
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(17px,2.6vw,23px);
  line-height:1.7;font-style:italic;font-weight:400;
  margin:0 40px 28px;
  text-align:center;
  position:relative;
  border-bottom:none;
}
.page-phrase::before{
  content:"";display:block;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,rgba(255,216,107,.4),transparent);
  margin-bottom:22px;
}
.page-phrase::after{
  content:"❦";position:absolute;bottom:-11px;left:50%;
  transform:translateX(-50%);
  color:var(--gold);font-size:20px;
  background:linear-gradient(155deg,#2a1c48,#0f0a1d);
  padding:0 14px;
  text-shadow:0 0 12px rgba(255,216,107,.7);
}

.page-gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:20px;
  padding:0 40px 42px;
}
.page-gallery .photo{
  appearance:none;border:none;
  padding:6px;width:100%;
  aspect-ratio:4/3;border-radius:22px;
  background:linear-gradient(135deg,rgba(255,216,107,.45),rgba(255,107,138,.35),rgba(139,92,246,.4));
  cursor:zoom-in;
  position:relative;
  transition:transform .5s cubic-bezier(.22,1,.36,1),
             box-shadow .4s ease,
             background .4s ease;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  overflow:hidden;
  isolation:isolate;
}
.page-gallery .photo::before{
  content:"";position:absolute;inset:6px;border-radius:16px;overflow:hidden;
  background:#0a0812;z-index:0;
}
.page-gallery .photo img{
  position:absolute;inset:6px;
  width:calc(100% - 12px);height:calc(100% - 12px);
  border-radius:16px;
  object-fit:cover;display:block;z-index:1;
  transition:transform .7s cubic-bezier(.22,1,.36,1),filter .4s ease;
}
.page-gallery .photo::after{
  content:"";position:absolute;inset:6px;border-radius:16px;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);
  opacity:0;transition:opacity .5s ease;z-index:2;
  pointer-events:none;
}
.page-gallery .photo:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 25px 55px rgba(0,0,0,.6),
             0 0 45px rgba(255,216,107,.4);
}
.page-gallery .photo:hover img{transform:scale(1.08);filter:brightness(1.08) saturate(1.1)}
.page-gallery .photo:hover::after{opacity:1}
.page-gallery .photo:active{transform:translateY(-4px) scale(1.01)}
.page-gallery:empty{display:none}

.nav-bar{
  display:flex;align-items:center;justify-content:center;gap:24px;
  padding:32px 20px 20px;width:100%;max-width:640px;margin:0 auto;
}
.nav-btn{
  position:relative;
  width:62px;height:62px;border-radius:50%;
  border:none;
  background:linear-gradient(145deg,rgba(255,216,107,.18),rgba(255,216,107,.04));
  color:var(--gold);font-size:26px;
  cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1);
  display:grid;place-items:center;
  backdrop-filter:blur(10px);
  font-family:'Montserrat',sans-serif;flex-shrink:0;
  box-shadow:0 6px 20px rgba(0,0,0,.4),
             inset 0 0 0 1.5px rgba(255,216,107,.5);
}
.nav-btn:hover:not(:disabled){
  background:linear-gradient(145deg,var(--gold),var(--gold-2));
  color:#1a0f2e;
  box-shadow:0 0 40px rgba(255,216,107,.6),
             0 10px 30px rgba(0,0,0,.5);
  transform:scale(1.12) translateY(-2px);
}
.nav-btn:disabled{opacity:.22;cursor:not-allowed;box-shadow:none}
.nav-btn:active:not(:disabled){transform:scale(.96)}

.nav-dots{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:320px;
}
.nav-dot{
  width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.18);
  border:none;cursor:pointer;transition:all .3s ease;padding:0;
}
.nav-dot.active{
  background:var(--gold);
  box-shadow:0 0 16px rgba(255,216,107,.9);
  transform:scale(1.5);
}
.nav-dot:hover{background:rgba(255,216,107,.65)}

.page-indicator{
  text-align:center;color:var(--muted);font-size:11px;
  letter-spacing:3px;margin-top:6px;padding-bottom:12px;
  text-transform:uppercase;font-weight:500;
}

.page-final .page-inner{
  border:2px solid transparent;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,216,107,.1),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(255,107,138,.1),transparent 40%),
    linear-gradient(155deg,rgba(42,28,72,.97),rgba(11,8,22,.99));
  background-clip:padding-box;
  position:relative;overflow:hidden;
  box-shadow:0 0 100px rgba(255,216,107,.2),var(--shadow-deep);
}
.page-final .page-inner::after{
  content:"";position:absolute;inset:-2px;border-radius:var(--page-radius);
  background:var(--gold-grad);background-size:200% 200%;
  animation:goldShine 5s ease-in-out infinite;
  z-index:-1;
}
.page-final .closing-content{
  padding:55px 48px 65px;text-align:center;position:relative;z-index:1;
}
.page-final .year-big{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(50px,8vw,80px);
  font-weight:700;line-height:1;margin-bottom:6px;letter-spacing:2px;
  background:var(--gold-grad);background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,216,107,.5));
  animation:goldShine 5s ease-in-out infinite;
}
.page-final .cake-big{
  font-size:78px;margin:14px 0 18px;
  animation:cakeBounce 2.4s ease-in-out infinite;
  filter:drop-shadow(0 14px 40px rgba(255,216,107,.5));
}
.page-final h2{
  font-family:'Cormorant Garamond',serif;
  color:var(--gold-3);
  font-size:clamp(26px,4.2vw,42px);
  margin:14px 0 26px;font-style:italic;font-weight:600;
  letter-spacing:.5px;
}
.page-final .intro{
  color:var(--muted);font-style:italic;line-height:2;
  margin-bottom:28px;font-size:16px;
  font-family:'Cormorant Garamond',serif;
}
.page-final .intro p{margin-bottom:12px}
.page-final .heart{
  font-size:38px;margin:24px 0;color:var(--pink);
  animation:heartbeat 1.6s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(255,107,138,.7));
}
.page-final .closing-text{
  text-align:left;line-height:2;font-size:16px;
  max-width:720px;margin:0 auto;
  font-family:'Cormorant Garamond',serif;
  color:var(--white);
}
.page-final .closing-text p{margin-bottom:20px;text-indent:20px}
.page-final .signature{
  font-family:'Great Vibes',cursive;color:var(--gold);

.lightbox{

  animation:fadeIn .3s ease;

.progress{

/* ===== CONFETI ===== */
const confettiCanvas = document.getElementById('confettiCanvas');
const ctx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiActive = false;

function resizeCanvas(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const confettiColors = ['#ffd86b','#ff6b8a','#8b5cf6','#5ac8ff','#6ee7a8','#fffaf5','#ffeaa7'];

function createConfetti(count = 60){
  for(let i=0;i<count;i++){
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 100,
      w: 6 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      vy: 1.5 + Math.random() * 2.5,
      vx: (Math.random() - 0.5) * 1.5,
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 8,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
      life: 1
    });
  }
  if(!confettiActive){
    confettiActive = true;
    animateConfetti();
  }
}

function animateConfetti(){
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiParticles.forEach((p, i) => {
    p.y += p.vy;
    p.x += p.vx + Math.sin(p.y * 0.01) * 0.5;
    p.rot += p.vrot;
    p.life -= 0.003;
    if(p.y > confettiCanvas.height + 30 || p.life <= 0){
      confettiParticles.splice(i, 1);
      return;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    if(p.shape === 'rect'){
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.w/2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  });
  if(confettiParticles.length > 0){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiActive = false;
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
}

/* ===== MÚSICA (YouTube API) ===== */
let ytPlayer = null;
let musicPlaying = false;
let musicReady = false;
let musicUnlocked = false;
const musicBtn = document.getElementById('musicBtn');

(function loadYouTubeAPI(){
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
})();

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('ytPlayer', {
    height: '1', width: '1',
    videoId: 'MpZeav_kE6g',
    playerVars: {
      autoplay: 0, controls: 0, disablekb: 1, fs: 0,
      modestbranding: 1, rel: 0, loop: 1,
      playlist: 'MpZeav_kE6g', playsinline: 1,
      origin: window.location.origin
    },
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange
    }
  });
};

function onPlayerReady(event){
  musicReady = true;
  if(musicUnlocked){
    event.target.playVideo();
    musicPlaying = true;
    updateMusicButton();
  }
}

function onPlayerStateChange(event){
  if(event.data === YT.PlayerState.ENDED){
    ytPlayer.seekTo(0);
    ytPlayer.playVideo();
  }
}

function tryPlayMusic(){
  if(musicUnlocked) return;
  musicUnlocked = true;
  if(musicReady && ytPlayer && typeof ytPlayer.playVideo === 'function'){
    ytPlayer.playVideo();
    musicPlaying = true;
    updateMusicButton();
  } else {
    musicPlaying = true;
    updateMusicButton();
  }
}

function toggleMusic(){
  if(!musicReady || !ytPlayer || typeof ytPlayer.pauseVideo !== 'function'){
    musicUnlocked = true; musicPlaying = true; updateMusicButton(); return;
  }
  if(musicPlaying){ ytPlayer.pauseVideo(); musicPlaying = false; }
  else { ytPlayer.playVideo(); musicPlaying = true; }
  updateMusicButton();
}

function updateMusicButton(){
  if(musicPlaying){
    musicBtn.classList.add('playing');
    musicBtn.innerHTML = '🎵';
    musicBtn.setAttribute('aria-label', 'Pausar música');
    musicBtn.title = 'Pausar música';
  } else {
    musicBtn.classList.remove('playing');
    musicBtn.innerHTML = '🔇';
    musicBtn.setAttribute('aria-label', 'Reproducir música');
    musicBtn.title = 'Reproducir música';
  }
}

musicBtn.addEventListener('click', function(e){
  e.stopPropagation();
  toggleMusic();
});

['click','touchstart','keydown','pointerdown'].forEach(function(evt){
  document.addEventListener(evt, tryPlayMusic, { once:false, passive:true });
});

          <p>Hoy miro hacia atrás y todavía puedo verte pequeño entre mis brazos. Parece mentira que aquel bebé que llegó a llenar mi vida de alegría hoy tenga 16 años. El tiempo ha pasado demasiado rápido…</p>
          <p>Y aunque quisiera detenerlo, solo puedo agradecerle a Dios por regalarme el privilegio de verte crecer. Que Dios cuide siempre tus pasos, proteja tu corazón y te acompañe en cada camino que decidas recorrer.</p>

/* ===== NAVEGACIÓN ===== */
function showPage(index) {
  const pages = document.querySelectorAll('.page');
  const cover = document.getElementById('cover');
  const dots = document.querySelectorAll('.nav-dot');

  if (index < 0 || index >= totalPages) return;

  if (cover) cover.style.display = 'none';
  pages.forEach((p, i) => p.classList.toggle('active', i === index));
  dots.forEach((d, i) => d.classList.toggle('active', i === index));

  currentPage = index;
  updateProgress();
  updateNavButtons();
  window.scrollTo({top: 0, behavior: 'smooth'});

  if (index === totalPages - 1) {
    setTimeout(() => createConfetti(150), 400);
  }
}

function updateProgress() {
  const progress = document.getElementById('progress');
  const pct = totalPages > 1 ? (currentPage + 1) / totalPages : 1;
  progress.style.transform = `scaleX(${pct})`;
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.disabled = currentPage <= 0;
  if (nextBtn) nextBtn.disabled = currentPage >= totalPages - 1;

  const indicator = document.getElementById('pageIndicator');
  if (indicator) {
    if (currentPage >= 0) {
      indicator.textContent = `Página ${currentPage + 1} de ${totalPages}`;
      indicator.style.display = 'block';
    } else {
      indicator.style.display = 'none';
    }
  }
}

function buildNav() {
  const nav = document.createElement('div');
  nav.className = 'nav-bar';
  nav.innerHTML = `
    <button class="nav-btn" id="prevBtn" aria-label="Anterior" disabled>‹</button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Siguiente">›</button>
  `;
  document.getElementById('book').appendChild(nav);

  const indicator = document.createElement('div');
  indicator.className = 'page-indicator';
  indicator.id = 'pageIndicator';
  indicator.style.display = 'none';
  document.getElementById('book').appendChild(indicator);

  const dotsContainer = document.getElementById('navDots');
  for (let i = 0; i < totalPages; i++) {
    const dot = document.createElement('button');
    dot.className = 'nav-dot';
    dot.setAttribute('aria-label', `Ir a página ${i + 1}`);
    dot.addEventListener('click', () => showPage(i));
    dotsContainer.appendChild(dot);
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 0) showPage(currentPage - 1);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < totalPages - 1) showPage(currentPage + 1);
  });
}

/* ===== LIGHTBOX ===== */

const lightboxImg = document.getElementById('lightboxImg');
const closeLightbox = document.getElementById('closeLightbox');

  lightboxImg.alt = alt || 'Recuerdo de Ferchito';
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closePhoto() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxImg.src = '';
  document.body.style.overflow = '';
}

document.addEventListener('click', (e) => {
  const photoBtn = e.target.closest('.photo');
  if (photoBtn) {
    const img = photoBtn.querySelector('img');
    openPhoto(photoBtn.dataset.full, img?.alt);
  }
});
closeLightbox.addEventListener('click', closePhoto);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closePhoto();
});

/* ===== TECLADO ===== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePhoto(); return; }
  if (lightbox.classList.contains('open')) return;

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (currentPage < totalPages - 1) showPage(currentPage + 1);
    else if (currentPage === -1) startBook();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (currentPage > 0) showPage(currentPage - 1);
    else if (currentPage === 0) goToCover();
  }
});

/* ===== INICIO ===== */
function startBook() {
  createConfetti(120);
  showPage(0);
}

function goToCover() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('cover').style.display = 'flex';
  currentPage = -1;
  document.getElementById('progress').style.transform = 'scaleX(0)';
  updateNavButtons();
  document.getElementById('pageIndicator').style.display = 'none';
  document.querySelectorAll('.nav-dot').forEach(d => d.classList.remove('active'));
}

/* ===== INICIALIZAR ===== */
function init() {
  buildPages();
  buildNav();

  document.getElementById('startBtn').addEventListener('click', function(e){
    e.stopPropagation();
    startBook();
  });
  document.getElementById('cover').addEventListener('click', (e) => {
    if (e.target.id === 'cover' || e.target.closest('.cover')) {
      if (e.target.tagName !== 'BUTTON') startBook();
    }
  });

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  pagesData.forEach(data => {
    data.photos.forEach(p => {
      const img = new Image();
      img.src = p.src;
    });
  });
}

setTimeout(() => {
  document.querySelectorAll('.page-gallery').forEach(gallery => {
    if (!gallery.querySelector('img') && gallery.children.length > 0) {
      gallery.innerHTML = '<p style="color:var(--muted);font-style:italic;padding:30px;text-align:center;grid-column:1/-1;">✨ Recuerdo guardado en el corazón ✨</p>';
    }
  });
}, 3000);

init();
</script>
</body>
